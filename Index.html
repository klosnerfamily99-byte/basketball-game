<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize(); window.addEventListener("resize",resize);

// HOOP
const userHoop = { x:()=>canvas.width-30, y:()=>canvas.height/2 };
const cpuHoop  = { x:()=>20, y:()=>canvas.height/2 };

// COURT
function drawCourt(){
    ctx.fillStyle="#d28b5c";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#fff"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(canvas.width/2,0); ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width/2,canvas.height/2,60,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle="red";
    ctx.fillRect(userHoop.x(),userHoop.y()-20,10,40);
    ctx.fillRect(cpuHoop.x(),cpuHoop.y()-20,10,40);
}

// PLAYER
class Player{
    constructor(x,y,team){
        this.x=x; this.y=y; this.team=team;
        this.size=22; this.vx=0; this.vy=0;
        this.home={x,y};
    }
    center(){return {x:this.x+this.size/2,y:this.y+this.size/2};}
    draw(active=false){
        if(active){
            ctx.strokeStyle="#00ffff"; ctx.lineWidth=3;
            ctx.strokeRect(this.x-4,this.y-4,this.size+8,this.size+8);
        }
        ctx.fillStyle=this.team==="user"?"#fff":"#ff4444";
        ctx.fillRect(this.x,this.y,this.size,this.size);
    }
    update(){
        this.x+=this.vx; this.y+=this.vy;
        this.x=Math.max(0,Math.min(canvas.width-this.size,this.x));
        this.y=Math.max(0,Math.min(canvas.height-this.size,this.y));
    }
}

// BALL
let ball={x:0,y:0,vx:0,vy:0,heldBy:null,target:null,r:6};
function drawBall(){
    ctx.fillStyle="#ff8c00";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();
}

// TEAMS
let userTeam=[], cpuTeam=[];
for(let i=0;i<5;i++){
    userTeam.push(new Player(canvas.width*0.65,100+i*80,"user"));
    cpuTeam.push(new Player(canvas.width*0.35,100+i*80,"cpu"));
}

let controlled=userTeam[0];
ball.heldBy=controlled;

// SET OFFENSIVE SPOTS (RIGHT SIDE)
function setUserSpacing(){
    const w=canvas.width, h=canvas.height;
    const spots=[
        {x:w*0.65,y:h/2},
        {x:w*0.75,y:h*0.25},
        {x:w*0.75,y:h*0.75},
        {x:w*0.85,y:h*0.4},
        {x:w*0.85,y:h*0.6}
    ];
    userTeam.forEach((p,i)=>{p.home=spots[i];});
}

// SET CPU DEFENSE (LEFT SIDE)
function setCpuSpacing(){
    const w=canvas.width, h=canvas.height;
    const spots=[
        {x:w*0.35,y:h/2},
        {x:w*0.25,y:h*0.25},
        {x:w*0.25,y:h*0.75},
        {x:w*0.15,y:h*0.4},
        {x:w*0.15,y:h*0.6}
    ];
    cpuTeam.forEach((p,i)=>{p.home=spots[i];});
}

setUserSpacing();
setCpuSpacing();

// JOYSTICK
let moveX=0, moveY=0;
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

joystick.addEventListener("touchmove",(e)=>{
    const r=joystick.getBoundingClientRect();
    let x=e.touches[0].clientX-r.left-55;
    let y=e.touches[0].clientY-r.top-55;
    const d=Math.min(45,Math.hypot(x,y));
    const a=Math.atan2(y,x);
    moveX=Math.cos(a)*d/7;
    moveY=Math.sin(a)*d/7;
    stick.style.left=35+Math.cos(a)*d+"px";
    stick.style.top=35+Math.sin(a)*d+"px";
});
joystick.addEventListener("touchend",()=>{
    moveX=0; moveY=0;
    stick.style.left="35px"; stick.style.top="35px";
});

// DISTANCE
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// PASS
document.getElementById("pass").addEventListener("touchstart",(e)=>{
    e.preventDefault();
    if(!ball.heldBy) return;

    let closest=null, min=9999;
    userTeam.forEach(p=>{
        if(p!==controlled){
            const d=dist(p.center(),controlled.center());
            if(d<min){min=d; closest=p;}
        }
    });

    if(!closest) return;

    ball.heldBy=null;
    ball.target=closest;

    const from=controlled.center();
    const to=closest.center();
    const dx=to.x-from.x, dy=to.y-from.y;
    const mag=Math.hypot(dx,dy);

    ball.vx=(dx/mag)*12;
    ball.vy=(dy/mag)*12;
    controlled=closest;
},{passive:false});

// BALL UPDATE
function updateBall(){
    if(ball.heldBy){
        const c=ball.heldBy.center();
        ball.x=c.x; ball.y=c.y;
    } else {
        ball.x+=ball.vx;
        ball.y+=ball.vy;
        if(ball.target){
            const d=dist(ball,ball.target.center());
            if(d<18){
                ball.heldBy=ball.target;
                ball.target=null;
                ball.vx=0; ball.vy=0;
            }
        }
    }
}

// AI MOVEMENT
function updateAI(){
    // USER TEAM OFFENSE (MOVE TO SPOTS)
    userTeam.forEach(p=>{
        if(p!==controlled){
            const dx=p.home.x-p.x;
            const dy=p.home.y-p.y;
            p.vx=dx*0.02;
            p.vy=dy*0.02;
        }
    });

    // CPU DEFENSE (GUARD CLOSEST USER)
    cpuTeam.forEach(cpu=>{
        let target=null, min=9999;
        userTeam.forEach(user=>{
            const d=dist(cpu.center(),user.center());
            if(d<min){min=d; target=user;}
        });
        if(target){
            const dx=target.x-cpu.x;
            const dy=target.y-cpu.y;
            cpu.vx=dx*0.02;
            cpu.vy=dy*0.02;
        }
    });
}

// LOOP
function update(){
    controlled.vx=moveX;
    controlled.vy=moveY;
    updateAI();
    userTeam.forEach(p=>p.update());
    cpuTeam.forEach(p=>p.update());
    updateBall();
}

function draw(){
    drawCourt();
    userTeam.forEach(p=>p.draw(p===controlled));
    cpuTeam.forEach(p=>p.draw());
    drawBall();
}

function loop(){
    update(); draw();
    requestAnimationFrame(loop);
}
loop();
</script>
